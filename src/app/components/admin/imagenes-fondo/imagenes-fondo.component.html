<div class="min-w-0 flex-auto bg-gray-50 dark:bg-gray-900">
  <div class="mx-auto w-full max-w-screen-2xl px-3 py-5 sm:px-6 lg:px-8">
    @if (cargando) {
      <div class="space-y-5 rounded-2xl bg-white p-8 dark:bg-gray-800" role="status" aria-label="Cargando imágenes de fondo">
        <div class="h-10 w-2/3 animate-pulse rounded-lg bg-gray-200 dark:bg-gray-700"></div>
        <div class="h-12 animate-pulse rounded-lg bg-gray-200 dark:bg-gray-700"></div>
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-4"><div *ngFor="let item of [1,2,3,4,5,6,7,8]" class="aspect-square animate-pulse rounded-2xl bg-gray-200 dark:bg-gray-700"></div></div>
      </div>
    } @else if (error) {
      <section class="rounded-xl border border-red-200 bg-red-50 p-5 text-red-800 dark:border-red-900 dark:bg-red-950 dark:text-red-200" role="alert">
        <h1 class="text-xl font-bold">Imágenes de fondo</h1><p class="mt-2">{{ error }}</p>
        <button mat-stroked-button class="mt-4" (click)="cargarDatos()"><mat-icon class="mr-1.5 icon-size-4">refresh</mat-icon>Reintentar</button>
      </section>
    } @else {
      <app-folder-image-manager title="Imágenes de fondo"
        subtitle="Administra las imágenes y los textos del carrusel de inicio. Las traducciones se generan al guardar."
        [folders]="galeriaCarpetas" [selectedImageId]="imagenSeleccionadaId" [activeImageIds]="imagenesActivasIds"
        [showFolders]="false" [showFolderManagement]="false" [showDetailPanel]="true"
        [allowImageReorder]="false"
        [showDeleteAllImages]="imagenes.length > 0" [isSaving]="guardando || procesandoSeleccion || cambiandoEstadoId !== null"
        [isDeletingAllImages]="procesandoSeleccion" [selectionResetKey]="selectionResetKey"
        (addImage)="abrirNueva()" (imageSelected)="imagenSeleccionadaId = +$event.id"
        (editImage)="editarDesdeGaleria($event)" (deleteImage)="eliminarDesdeGaleria($event)"
        (toggleImageActive)="cambiarEstadoDesdeGaleria($event)" (toggleImageDarken)="cambiarOscurecimiento($event)"
        (toggleSelectedImagesActive)="seleccionarDesdeGaleria($event, 'estado')"
        (deleteSelectedImages)="seleccionarDesdeGaleria($event, 'eliminar')" (deleteAllImages)="eliminarTodas()" />
    }
  </div>
</div>

@if (modalAbierto) {
  <app-image-visual-editor [value]="editorValue" [nameOnly]="true" [saving]="guardando" (save)="guardarDesdeEditor($event)" (cancel)="cerrarModal()" />
}
<app-blocking-loader [open]="guardando" title="Guardando imagen" message="Estamos traduciendo y guardando los cambios." />
