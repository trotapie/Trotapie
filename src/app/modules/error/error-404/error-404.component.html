<ng-container *transloco="let t">
<div class="relative min-h-screen w-full overflow-x-hidden bg-slate-50 text-slate-800 selection:bg-primary/20 selection:text-primary dark:bg-[#111827] dark:text-slate-100 flex flex-col">

    <!-- Fondo de Contornos Topográficos y Degradados Atmosféricos -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
        <!-- Manchas de luz ambiental -->
        <div class="absolute -top-32 -left-32 h-96 w-96 rounded-full bg-[#00a67c]/15 blur-3xl dark:bg-[#00a67c]/10"></div>
        <div class="absolute top-1/3 -right-32 h-[30rem] w-[30rem] rounded-full bg-[#ffc107]/15 blur-3xl dark:bg-[#ffc107]/8"></div>
        <div class="absolute -bottom-32 left-1/4 h-96 w-96 rounded-full bg-emerald-500/10 blur-3xl dark:bg-emerald-600/5"></div>

        <!-- Curvas de nivel topográficas vectoriales decorativas -->
        <svg class="absolute inset-0 h-full w-full stroke-emerald-900/[0.04] dark:stroke-emerald-400/[0.04]" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1440 900" fill="none">
            <path d="M-100 150 C 300 280, 600 -50, 1000 120 C 1200 180, 1400 50, 1600 160" stroke-width="2" stroke-dasharray="4 8" />
            <path d="M-100 320 C 250 480, 750 150, 1100 340 C 1300 420, 1500 280, 1600 360" stroke-width="1.5" />
            <path d="M-100 500 C 350 620, 700 380, 1150 560 C 1350 630, 1450 490, 1600 530" stroke-width="2" stroke-dasharray="8 6" />
            <path d="M-100 680 C 200 820, 650 560, 1050 740 C 1280 810, 1480 690, 1600 720" stroke-width="1.5" />
        </svg>

        <!-- Cuadrícula sutil de latitud / longitud -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#00000005_1px,transparent_1px),linear-gradient(to_bottom,#00000005_1px,transparent_1px)] dark:bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
    </div>

    <!-- Header Superior Fijo con Logo e Indicador -->
    <header class="fixed top-0 inset-x-0 z-30 w-full px-6 py-3.5 sm:px-10 lg:px-16 flex items-center justify-between border-b border-gray-200/60 dark:border-gray-800/60 bg-slate-50/90 dark:bg-[#111827]/90 backdrop-blur-md transition-colors">
        <a [routerLink]="['/inicio']" class="group flex items-center gap-3 transition-transform duration-200 hover:scale-[1.01]" [attr.aria-label]="t('error-404-home-aria')">
            <img src="assets/images/logos/trotapie.png" alt="Trotapie" class="h-9 sm:h-11 w-auto dark:hidden" />
            <img src="assets/images/logos/trotapie b.png" alt="Trotapie" class="h-9 sm:h-11 w-auto hidden dark:block" />
        </a>

        <div class="flex items-center gap-3">
            <span class="hidden sm:inline-flex items-center gap-2 rounded-full border border-gray-200/80 bg-white/80 px-3.5 py-1 text-sm font-medium text-gray-600 shadow-sm backdrop-blur-md dark:border-gray-800 dark:bg-gray-900/80 dark:text-gray-300">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Trotapie México</span>
            </span>
        </div>
    </header>

    <!-- Contenido Principal Central con espacio para header y footer fijos -->
    <main class="relative z-10 flex-1 w-full mx-auto max-w-5xl px-4 pt-24 pb-20 sm:pt-28 sm:pb-24 sm:px-8 flex flex-col items-center justify-center text-center my-auto">

        <!-- Badge de Estado 404 -->
        <div class="inline-flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-4 py-1.5 text-xs font-semibold uppercase tracking-wider text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-950/40 dark:text-emerald-400 shadow-sm mb-6">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span>{{ t('error-404-status') }}</span>
        </div>

        <!-- Ilustración Central de Brújula y Número 404 -->
        <div class="relative flex items-center justify-center my-2 select-none">
            <!-- Halo resplandeciente detrás -->
            <div class="absolute h-52 w-52 sm:h-72 sm:w-72 rounded-full bg-gradient-to-tr from-emerald-500/20 via-teal-500/15 to-amber-400/20 blur-2xl dark:from-emerald-500/15 dark:to-amber-400/10"></div>

            <!-- Gran 404 con Brújula Integrada -->
            <div class="relative flex items-center justify-center gap-2 sm:gap-6 font-extrabold tracking-tighter">
                <!-- Primer 4 -->
                <span class="text-7xl sm:text-9xl md:text-[11rem] leading-none bg-gradient-to-b from-gray-900 via-gray-700 to-gray-400 bg-clip-text text-transparent dark:from-white dark:via-gray-200 dark:to-gray-500 drop-shadow-sm font-display">
                    4
                </span>

                <!-- Cero en forma de Rosa de los Vientos / Brújula de Viaje -->
                <div class="relative flex items-center justify-center h-28 w-28 sm:h-40 sm:w-40 md:h-48 md:w-48">
                    <!-- Anillo exterior con grados -->
                    <div class="absolute inset-0 rounded-full border-2 border-dashed border-emerald-600/40 dark:border-emerald-400/30 animate-spin-slow"></div>

                    <!-- Anillo interior con marcas cardinales -->
                    <div class="absolute inset-2 sm:inset-3 rounded-full border border-gray-300 dark:border-gray-700 bg-white/80 dark:bg-gray-900/90 shadow-inner flex items-center justify-center backdrop-blur-sm">
                        <!-- Puntos cardinales -->
                        <span class="absolute top-1 text-[0.6rem] sm:text-xs font-bold text-emerald-600 dark:text-emerald-400">N</span>
                        <span class="absolute bottom-1 text-[0.6rem] sm:text-xs font-bold text-gray-400">S</span>
                        <span class="absolute right-1.5 text-[0.6rem] sm:text-xs font-bold text-gray-400">E</span>
                        <span class="absolute left-1.5 text-[0.6rem] sm:text-xs font-bold text-gray-400">W</span>

                        <!-- Aguja de brújula con balanceo suave -->
                        <div class="compass-needle flex flex-col items-center justify-center">
                            <!-- Punta Norte (Roja / Ámbar) -->
                            <div class="w-0 h-0 border-x-[6px] sm:border-x-[8px] border-x-transparent border-b-[30px] sm:border-b-[44px] border-b-[#00a67c]"></div>
                            <!-- Centro del eje -->
                            <div class="h-3 w-3 sm:h-4 sm:w-4 rounded-full bg-amber-500 border-2 border-white dark:border-gray-900 shadow-md my-[-3px] z-10"></div>
                            <!-- Punta Sur -->
                            <div class="w-0 h-0 border-x-[6px] sm:border-x-[8px] border-x-transparent border-t-[30px] sm:border-t-[44px] border-t-gray-400 dark:border-t-gray-600"></div>
                        </div>
                    </div>

                    <!-- Pin de ubicación desfasado con pulso -->
                    <div class="absolute -top-2 -right-2 sm:-top-3 sm:-right-3 flex items-center justify-center">
                        <span class="absolute h-6 w-6 rounded-full bg-red-400/40 animate-ping"></span>
                        <div class="relative flex h-7 w-7 sm:h-8 sm:w-8 items-center justify-center rounded-full bg-red-500 text-white shadow-lg">
                            <mat-icon class="icon-size-4 text-white" svgIcon="heroicons_outline:map-pin"></mat-icon>
                        </div>
                    </div>
                </div>

                <!-- Segundo 4 -->
                <span class="text-7xl sm:text-9xl md:text-[11rem] leading-none bg-gradient-to-b from-gray-900 via-gray-700 to-gray-400 bg-clip-text text-transparent dark:from-white dark:via-gray-200 dark:to-gray-500 drop-shadow-sm font-display">
                    4
                </span>
            </div>
        </div>

        <!-- Título H1 y Explicación -->
        <h1 class="mt-4 text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white max-w-2xl leading-tight">
            {{ t('error-404-title') }}
        </h1>
        <p class="mt-3 text-sm sm:text-base text-gray-600 dark:text-gray-300 max-w-xl leading-relaxed">
            {{ t('error-404-description') }}
        </p>

        <!-- Grupo de Botones de Acción (Estricta conformidad con iconos obligatorios) -->
        <div class="mt-8 flex flex-wrap items-center justify-center gap-3 w-full max-w-xl">
            <!-- Botón Principal: Explorar Destinos -->
            <a mat-flat-button color="primary" [routerLink]="['/inicio']" class="rounded-xl px-6 py-2.5 text-white shadow-md shadow-emerald-700/20 hover:shadow-lg transition-all duration-200 flex-1 sm:flex-initial">
                <mat-icon class="mr-2 icon-size-5" svgIcon="heroicons_outline:map-pin"></mat-icon>
                {{ t('error-404-explore') }}
            </a>

            <!-- Botón Secundario: Volver Atrás
            <button mat-stroked-button (click)="goBack()" class="rounded-xl px-5 py-2.5 flex-1 sm:flex-initial" aria-label="Volver a la página previa">
                <mat-icon class="mr-1.5 icon-size-4" svgIcon="heroicons_outline:arrow-left"></mat-icon>
                Volver Atrás
            </button> -->

            <!-- Botón Condicional: Panel Administrativo (si aplica) -->
            @if (isAdminRouteAttempt()) {
            <a mat-stroked-button [routerLink]="['/admin/dashboard']" class="rounded-xl px-5 py-2.5 border-emerald-500/40 text-emerald-700 dark:text-emerald-400 dark:border-emerald-500/30 flex-1 sm:flex-initial">
                <mat-icon class="mr-1.5 icon-size-4" svgIcon="heroicons_outline:squares-2x2"></mat-icon>
                {{ t('error-404-dashboard') }}
            </a>
            }
        </div>

    </main>

    <!-- Footer Fijo con Backdrop Blur -->
    <footer class="fixed bottom-0 inset-x-0 z-30 w-full px-6 py-3 sm:py-3.5 sm:px-10 lg:px-16 border-t border-gray-200/60 dark:border-gray-800/60 bg-slate-50/90 dark:bg-[#111827]/90 backdrop-blur-md flex flex-col sm:flex-row items-center justify-between gap-2 text-md text-gray-500 dark:text-gray-400 transition-colors">
        <div>
            <span>{{ t('error-404-copyright', { year: currentYear }) }}</span>
        </div>
        
    </footer>
</div>
</ng-container>
