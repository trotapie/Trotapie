<style>
    :host {
        display: block;
    }

    .signature-banner {
        --green: #008b78;
        --deep-green: #006d63;
        --gold: #ffb900;
        position: relative;
        width: min(100%, 2000px);
        aspect-ratio: 3 / 1;
        container-type: inline-size;
        overflow: hidden;
        border-radius: 2.4cqw;
        background: #fff;
        box-shadow: 0 14px 30px rgb(0 62 57 / 16%);
        color: var(--deep-green);
        font-family: Montserrat, 'Trebuchet MS', sans-serif;
    }

    .artwork,
    .travel-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .travel-art {
        left: auto;
        width: 51%;
    }

    .signature-content {
        position: absolute;
        top: 13%;
        left: 2.2%;
        width: 94%;
        height: 55%;
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .brand-section,
    .employee-section {
        position: relative;
        min-width: 0;
    }

    .brand-section {
        display: flex;
        align-items: center;
        justify-content: center;
        /* gap: 8%; */
    }

    .qr-column {
        width: 34%;
    }

    .details::before {
        position: absolute;
        top: 14%;
        right: 0;
        width: .28cqw;
        min-width: 1px;
        height: 14.75cqw;
        background: #b9c1bf;
        content: '';
    }

    .qr-frame {
        width: 88%;
        aspect-ratio: 1;
        overflow: hidden;
    }

    .qr-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.22);
    }

    .details {
        position: relative;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 0 0 4.3%;
    }

    .center-gif {
        display: grid;
        width: 60%;
        height: 78%;
        place-items: center;
    }

    .center-gif img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .details::before {
        top: 0;
        right: auto;
        left: 0;
        height: 90%;
    }

    .name {
        margin: 0 0 1.5%;
        color: var(--green);
        font-size: 2.75cqw;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.05;
    }

    .role {
        margin: 0 0 6.6%;
        font-size: 1.72cqw;
        font-weight: 500;
        line-height: 1;
    }

    .contact {
        display: flex;
        align-items: center;
        gap: 1.05cqw;
        margin-top: 2.8%;
        color: #007868;
        font-size: 2.05cqw;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        transform: translateY(-.8cqw);
    }

    .contact-icon {
        flex: 0 0 auto;
        width: 3.1cqw;
        height: 3.1cqw;
    }

    .contact-icon path {
        transform: scale(.82);
        transform-box: view-box;
        transform-origin: center;
    }

    .contact-icon circle,
    .contact-icon path {
        fill: none;
        stroke: #00a18e;
        stroke-width: 3;
    }

    .contact-icon circle {
        display: none;
    }

    .socials {
        position: absolute;
        bottom: 5.1%;
        left: 5.8%;
        display: flex;
        align-items: center;
        gap: 1.1cqw;
    }

    .social {
        display: grid;
        width: 3.7cqw;
        aspect-ratio: 1;
        place-items: center;
        border: .1cqw solid var(--green);
        border-radius: 50%;
        color: var(--green);
    }

    .social svg {
        width: 56%;
        height: 56%;
        fill: currentColor;
        stroke: currentColor;
    }

    .social .map-pin-icon {
        fill: none;
    }

    .social-divider {
        width: 1px;
        height: 3.9cqw;
        background: var(--gold);
    }

    .legacy-socials {
        display: none;
    }

    .more-label {
        position: absolute;
        top: 107%;
        left: 37%;
        color: var(--gold);
        font-family: inherit;
        font-size: 2.05cqw;
        font-weight: 400;
        line-height: 1;
        transform: translateX(-50%);
    }

</style>

<section class="signature-banner" [attr.aria-label]="'Firma de ' + (empleado()?.nombre || 'empleado')">
    <svg class="artwork" viewBox="0 0 2000 667" preserveAspectRatio="none" aria-hidden="true">
        <path d="M980 667C1045 620 1110 600 1205 592C1430 573 1615 614 1768 602C1880 594 1935 500 1960 346C1979 225 1984 108 2000 45V667Z" fill="#ffb900" />
        <path d="M1010 667C1072 625 1138 608 1227 600C1448 582 1624 620 1776 610C1898 601 1952 507 1975 350C1990 240 1994 126 2000 82V667Z" fill="#006d63" />
        <path d="M1038 667C1098 631 1160 617 1248 609C1462 593 1637 628 1785 618C1914 610 1965 514 1985 355C1997 254 1999 144 2000 118V667Z" fill="#008b78" />
        <path d="M990 667C1055 618 1120 599 1214 591C1436 572 1619 613 1772 601C1887 592 1943 497 1967 344C1984 233 1989 118 2000 57" fill="none" stroke="#f5a900" stroke-width="4" opacity=".95" />
    </svg>

    <div class="signature-content">
        <section class="brand-section" aria-label="Marca Trotapie">
            <div class="qr-column">
                <div class="qr-frame"><img src="assets/images/qr.png" alt="Codigo QR de Trotapie" /></div>
            </div>

            <div class="center-gif">
                <img src="https://drive.google.com/thumbnail?id=1fgRGCqG9IFQgdx4WFPzFDLb80N11iJw1&sz=w1000" alt="Animacion de Trotapie" />
            </div>

            <span class="more-label">Conoce mas</span>
        </section>

        <section class="employee-section" aria-label="Datos de contacto">
            <div class="details">
        <h1 class="name">{{ empleado()?.nombre || '' }}</h1>
        <p class="role">{{ empleado()?.cargo || '' }}</p>
        @if (empleado()?.email; as email) {
        <a class="contact" [href]="emailHref()" [attr.aria-label]="'Enviar correo a ' + email">
            <svg class="contact-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21.5" fill="none" stroke="#00a18e" stroke-width="3" /><path d="M9 14h30v20H9zM10 15l14 11 14-11" fill="none" stroke="#00a18e" stroke-width="3" stroke-linejoin="round" /></svg>
            <span>{{ email }}</span>
        </a>
        } @else {
        <div class="contact">
            <svg class="contact-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21.5" fill="none" stroke="#00a18e" stroke-width="3" /><path d="M9 14h30v20H9zM10 15l14 11 14-11" fill="none" stroke="#00a18e" stroke-width="3" stroke-linejoin="round" /></svg>
            <span></span>
        </div>
        }
        @if (empleado()?.telefono; as telefono) {
        <a class="contact" [href]="whatsappHref()" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Contactar a ' + (empleado()?.nombre || 'Trotapie') + ' por WhatsApp'">
            <svg class="contact-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#00a18e" /><path d="M16 10c2 0 5 7 5 9 0 2-3 3-3 5 1 4 6 9 10 10 2 0 3-3 5-3 2 0 9 3 9 5 0 4-4 7-7 7-11 0-27-16-27-27 0-3 3-6 7-6Z" fill="white" /></svg>
            <span>{{ telefono }}</span>
        </a>
        } @else {
        <div class="contact">
            <svg class="contact-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#00a18e" /><path d="M16 10c2 0 5 7 5 9 0 2-3 3-3 5 1 4 6 9 10 10 2 0 3-3 5-3 2 0 9 3 9 5 0 4-4 7-7 7-11 0-27-16-27-27 0-3 3-6 7-6Z" fill="white" /></svg>
            <span></span>
        </div>
        }
            </div>
        </section>
    </div>

    <div class="socials legacy-socials" aria-label="Redes sociales de Trotapie">
        <a class="social" href="https://facebook.com/trotapie" target="_blank" rel="noopener noreferrer" aria-label="Facebook de Trotapie"><svg viewBox="0 0 48 48"><path d="M28 41V26h5l1-6h-6v-4c0-2 1-3 4-3h3V7h-5c-6 0-9 3-9 9v4h-5v6h5v15h7Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://x.com/trotapie" target="_blank" rel="noopener noreferrer" aria-label="X de Trotapie"><svg viewBox="0 0 48 48"><path d="M8 8h9l8 10 8-10h7L29 23l11 17h-9l-9-12-10 12H5l14-17L8 8Zm9 5H15l18 22h3L17 13Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://www.tiktok.com/@trotapie" target="_blank" rel="noopener noreferrer" aria-label="TikTok de Trotapie"><svg viewBox="0 0 48 48"><path d="M30 7c1 6 4 9 10 10v7c-4 0-7-1-10-3v12c0 11-15 12-20 5-5-7-1-17 9-18v7c-4 1-4 6-1 7 3 1 5-1 5-4V7h7Z" /></svg></a>
        @if (whatsappHref()) {
        <span class="social-divider"></span>
        <a class="social" [href]="whatsappHref()" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'WhatsApp de ' + (empleado()?.nombre || 'Trotapie')"><svg viewBox="0 0 48 48" fill="none" stroke-width="4"><path d="M39 23c0 9-7 16-16 16-3 0-5-1-7-2l-7 2 2-7c-1-3-2-5-2-8 0-9 7-16 15-16s15 7 15 15Z" /><path d="M18 16c1-2 2-1 3 1l1 3c0 1-2 2-2 3 1 3 4 5 7 6 1 0 2-2 3-2l3 1c2 1 3 2 1 3-2 2-5 2-8 1-5-2-10-7-12-12-1-3-1-6 1-8Z" /></svg></a>
        } @else {
        <span class="social-divider"></span>
        <span class="social" aria-label="WhatsApp no disponible"><svg viewBox="0 0 48 48" fill="none" stroke-width="4"><path d="M39 23c0 9-7 16-16 16-3 0-5-1-7-2l-7 2 2-7c-1-3-2-5-2-8 0-9 7-16 15-16s15 7 15 15Z" /><path d="M18 16c1-2 2-1 3 1l1 3c0 1-2 2-2 3 1 3 4 5 7 6 1 0 2-2 3-2l3 1c2 1 3 2 1 3-2 2-5 2-8 1-5-2-10-7-12-12-1-3-1-6 1-8Z" /></svg></span>
        }
        <span class="social-divider"></span>
        <a class="social" href="https://www.trotapie.com" target="_blank" rel="noopener noreferrer" aria-label="Sitio web de Trotapie"><svg viewBox="0 0 48 48" fill="none" stroke-width="3.5"><circle cx="24" cy="24" r="16" /><path d="M8 24h32M24 8c-7 8-7 24 0 32M24 8c7 8 7 24 0 32" /></svg></a>
    </div>

    <div class="socials" aria-label="Redes sociales de Trotapie">
        <a class="social" href="https://facebook.com/trotapie" target="_blank" rel="noopener noreferrer" aria-label="Facebook de Trotapie"><svg viewBox="0 0 48 48"><path d="M28 41V26h5l1-6h-6v-4c0-2 1-3 4-3h3V7h-5c-6 0-9 3-9 9v4h-5v6h5v15h7Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://x.com/trotapie" target="_blank" rel="noopener noreferrer" aria-label="X de Trotapie"><svg viewBox="0 0 48 48"><path d="M8 8h9l8 10 8-10h7L29 23l11 17h-9l-9-12-10 12H5l14-17L8 8Zm9 5H15l18 22h3L17 13Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://www.tiktok.com/@trotapie" target="_blank" rel="noopener noreferrer" aria-label="TikTok de Trotapie"><svg viewBox="0 0 48 48"><path d="M30 7c1 6 4 9 10 10v7c-4 0-7-1-10-3v12c0 11-15 12-20 5-5-7-1-17 9-18v7c-4 1-4 6-1 7 3 1 5-1 5-4V7h7Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://youtube.com/@trotapie" target="_blank" rel="noopener noreferrer" aria-label="YouTube de Trotapie"><svg viewBox="0 0 48 48"><path d="M42 14c-1-3-3-5-6-5-7-1-17-1-24 0-3 0-5 2-6 5-1 7-1 13 0 20 1 3 3 5 6 5 7 1 17 1 24 0 3 0 5-2 6-5 1-7 1-13 0-20ZM20 32V16l13 8-13 8Z" /></svg></a>
        <span class="social-divider"></span>
        <a class="social" href="https://maps.google.com/?q=Trotapie" target="_blank" rel="noopener noreferrer" aria-label="Ubicacion de Trotapie"><svg class="map-pin-icon" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21.75s7.5-6.18 7.5-12a7.5 7.5 0 1 0-15 0c0 5.82 7.5 12 7.5 12Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" /></svg></a>
    </div>
</section>
